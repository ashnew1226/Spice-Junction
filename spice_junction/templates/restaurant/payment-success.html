<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap (optional but recommended) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }
        .success-card {
            max-width: 500px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .checkmark {
            font-size: 70px;
            color: #28a745;
        }
        .btn-home {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="success-card">
    
    <div class="checkmark">✔</div>

    <h2 class="mt-3 text-success">Payment Successful!</h2>

    <p class="text-muted">
        Thank you for your order. Your payment has been processed successfully.
    </p>

    <hr>

    <p><strong>Order Status:</strong> Paid ✅</p>

    <p class="text-muted">
        You will receive your order shortly.
    </p>
    <p><strong>Order ID:</strong> {{ order.id }}</p>
    <p><strong>Payment ID:</strong> {{ order.payment_id }}</p>
    <p><strong>Total Paid:</strong> ₹{{ order.total_amount }}</p>
    <a href="/" class="btn btn-success btn-home">
        Continue Shopping
    </a>

</div>

</body>
</html>
