<!DOCTYPE html>
<html>
<head>
    <title>Login - Spice Junction</title>

    <!-- Bootstrap (optional but recommended) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
        }

        /* Navbar fix */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Login container */
        .login-container {
            height: calc(100vh - 90px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff7e5f;
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e66a50;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .extra {
            text-align: center;
            margin-top: 15px;
        }

        .extra a {
            text-decoration: none;
            color: #ff7e5f;
        }
    </style>
</head>

<body>

<!-- ✅ NAVBAR -->
<div class="container-fluid p-0 nav-bar bg-dark">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
        <a href="{% url 'home' %}" class="navbar-brand px-lg-4 m-0">
            <h3 class="m-0 text-uppercase text-white">SPICE JUNCTION</h3>
        </a>

        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
            <div class="navbar-nav ml-auto p-2">

                <a href="{% url 'home' %}" class="nav-item nav-link">Home</a>
                <a href="{% url 'menu' %}" class="nav-item nav-link">Menu</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'my_orders' %}" class="nav-item nav-link">My Orders</a>
                    <span class="nav-item nav-link text-success">Hi, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-item nav-link active">Login</a>
                {% endif %}

                <a href="{% url 'cart_detail' %}" class="btn btn-outline-light ml-2 position-relative">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge badge-danger position-absolute" style="top:-5px; right:-10px;">
                        {{ cart_count }}
                    </span>
                </a>

            </div>
        </div>
    </nav>
</div>

<!-- ✅ LOGIN FORM -->
<div class="login-container">
    <div class="login-box">

        <h2>Login</h2>

        {% if form.errors %}
            <div class="error">Invalid username or password</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <!-- Allauth uses "login" -->
            <input type="text" name="login" placeholder="Username or Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <div class="extra">
            <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
